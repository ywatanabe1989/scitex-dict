[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-dict"
version = "0.1.4"
description = "Dictionary utilities (DotDict, safe_merge) for the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "scitex-dev>=0.11.5",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-dict[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-dict"
Repository = "https://github.com/ywatanabe1989/scitex-dict"
Issues = "https://github.com/ywatanabe1989/scitex-dict/issues"
Documentation = "https://scitex-dict.readthedocs.io"

[project.entry-points."scitex_dev.docs"]
scitex-dict = "scitex_dict"

[project.entry-points."scitex_dev.skills"]
scitex-dict = "scitex_dict"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_dict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
